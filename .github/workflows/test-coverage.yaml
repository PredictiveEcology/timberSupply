## Thin caller -- dependencies, covr and the Codecov upload all live in
## PredictiveEcology/actions. This file only says when to run it.
##
## Pinned @main deliberately: tags freeze and rot (v0.1/v0.2 kept the
## ubuntugis PPA for months after the workflows rejected it). The actions repo
## gates merges with its own self-test CI.

name: test-coverage

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  # Group by ref so a PR run and a branch-push run never cancel each other.
  # Cancel a PR's superseded runs, but never a push/merge run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
